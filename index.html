<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babasaheb Bhimrao Ambedkar</title>
<meta name="description" content="The life and legacy of Dr. B. R. Ambedkar in 20 sections. English and Hindi.">

<!-- Fonts (optional: the page falls back to system fonts when offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Serif+Devanagari:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">

<style>
/* ==========================================================
   BACKGROUND IMAGES (keep the "images" folder next to this file)
   images/ambedkar.jpg          -> portrait shown on the home section
   images/jai-bhim-poster.jpg   -> poster behind the whole page and the last section
   ========================================================== */

   
   
:root{
  --img-portrait:url("images/ambedkar.jpg");
  --img-poster:url("images/jai-bhim-poster.jpg");

  --ink:#071642;
  --navy:#0A1F5C;
  --panel:rgba(17,43,120,.72);
  --line:#2A4BA0;
  --cream:#F5F2EA;
  --mute:#B9C6EC;
  --gold:#F2B90F;
  --head:'Libre Baskerville','Noto Serif Devanagari',Georgia,serif;
  --body:'Source Sans 3','Noto Sans Devanagari',Arial,sans-serif;
  --hdr:68px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 12px)}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);font-size:18px;line-height:1.65;overflow-x:hidden}
html[lang="hi"] body{line-height:1.8}
html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3{line-height:1.4}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img,svg{max-width:100%}

/* full-page faint photo behind everything */
.page-photo{position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(7,22,66,.8),rgba(7,22,66,.9)),var(--img-poster) center top/cover no-repeat}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:50;height:var(--hdr);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(12px,3vw,32px);background:rgba(7,22,66,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none}
.brand svg{flex:none;width:38px;height:38px;color:var(--gold)}
.brand span{font-family:var(--head);font-weight:700;font-size:clamp(.95rem,2.2vw,1.3rem);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;align-items:center;gap:10px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:8px 20px;border-radius:999px;border:1px solid var(--line);background:rgba(17,43,120,.55);cursor:pointer;font-weight:600;text-decoration:none;transition:background .2s,transform .2s}
.btn:hover{background:var(--line)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.btn.gold:hover{background:#ffd04a}
.btn:active{transform:scale(.97)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;cursor:pointer;min-height:42px;padding:6px 14px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--navy)}
.burger{display:inline-block;width:20px;height:14px;position:relative}
.burger i{position:absolute;left:0;right:0;height:2.5px;border-radius:2px;background:currentColor}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:6px}.burger i:nth-child(3){top:12px}
.progress{position:fixed;top:0;left:0;height:4px;width:0;background:var(--gold);z-index:60}

/* ---------- sections ---------- */
section{position:relative;padding:clamp(64px,10vw,110px) clamp(16px,5vw,64px);overflow:hidden}
section.alt{background:rgba(10,31,92,.5)}
section:not(.alt):not(.hero){background:rgba(7,22,66,.3)}
.box{position:relative;z-index:1;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(20px,3vw,34px)}
.eb{margin:0;font-size:.95rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h2{margin:6px 0 0;font-family:var(--head);font-weight:700;font-size:clamp(1.9rem,4.8vw,3.3rem);line-height:1.25;text-wrap:balance}
.lead{margin:0;font-size:clamp(1.15rem,2.2vw,1.55rem);line-height:1.65;color:#e1e8fb;max-width:62ch}
.muted{color:var(--mute)}
.scene{position:absolute;pointer-events:none;color:var(--gold);opacity:.12;z-index:0}
.scene svg{display:block;width:100%;height:auto}
.scene.sq{right:-8%;bottom:-6%;width:min(64vw,640px)}
.scene.wide{left:0;right:0;bottom:0}
.chakra{animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.js .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.js .reveal.in{opacity:1;transform:none}

/* ---------- hero (home) ---------- */
.hero{min-height:calc(100vh - var(--hdr));display:flex;align-items:center;padding-block:clamp(48px,8vw,90px);background:radial-gradient(900px 500px at 80% 10%,#17358f,transparent 60%),var(--ink)}
.hero::before{content:"";position:absolute;top:0;bottom:0;right:0;width:min(54vw,700px);background:var(--img-portrait) center top/cover no-repeat;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 48%);mask-image:linear-gradient(to right,transparent 0,#000 48%);opacity:.92;z-index:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(7,22,66,.55) 0%,rgba(7,22,66,0) 60%);z-index:0}
#jay{background:linear-gradient(rgba(7,22,66,.55),rgba(7,22,66,.86)),var(--img-poster) center 25%/cover no-repeat}
.hero .box{gap:clamp(18px,2.4vw,28px)}
.hero h1{margin:0;font-family:var(--head);font-weight:700;font-size:clamp(2.2rem,6.4vw,4.8rem);line-height:1.2;text-wrap:balance;max-width:16ch}
.yrs{margin:0;color:var(--mute);font-size:1.25rem;letter-spacing:.08em}
.pills{display:flex;flex-wrap:wrap;gap:12px}
.pills span{background:var(--gold);color:var(--navy);font-weight:700;border-radius:999px;padding:6px 24px;font-size:clamp(1rem,2vw,1.35rem)}
.pills.small span{background:var(--navy);color:var(--cream);border:1px solid var(--line);font-size:1rem;padding:4px 18px}
.cta{display:flex;flex-wrap:wrap;gap:14px}
.hero .chakra-big{position:absolute;left:-12%;top:50%;width:min(50vw,560px);transform:translateY(-50%);color:var(--gold);opacity:.1;z-index:0;pointer-events:none;transition:transform .2s ease-out}
.hero .chakra-big svg{display:block;width:100%}

.tl{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,28px);max-width:760px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:14px}
.tl h3{margin:0;font-size:1rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.tl-out{display:flex;gap:clamp(14px,3vw,28px);align-items:flex-start;min-height:92px}
.tl-year{font-family:var(--head);font-weight:700;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums;min-width:4ch}
.tl-ev{font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.55}
.tl input[type=range]{width:100%;accent-color:var(--gold);height:32px;cursor:pointer}
.tl-jump{display:flex;flex-wrap:wrap;gap:8px}
.tl-jump button{min-height:38px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.tl-jump button:hover{background:var(--line)}
.scroll-hint{display:inline-flex;align-items:center;gap:10px;color:var(--mute);font-size:.95rem}
.scroll-hint i{width:22px;height:34px;border:2px solid var(--mute);border-radius:12px;position:relative}
.scroll-hint i::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--gold);animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(12px)}}

/* ---------- cards / rows ---------- */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.card{display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px;backdrop-filter:blur(6px);transition:transform .25s,border-color .25s}
.card span{display:block}
.card:hover{transform:translateY(-4px);border-color:var(--gold)}
.card .big{font-family:var(--head);font-weight:700;font-size:2.1rem;line-height:1.3;color:var(--gold)}
.card .k{font-weight:700;font-size:.95rem;color:var(--gold);letter-spacing:.06em}
.card .v{font-weight:700;font-size:1.35rem;line-height:1.5}
.card .s{color:var(--mute);font-size:1.02rem;line-height:1.6}
.card.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.card.gold .k,.card.gold .s,.card.gold .big{color:var(--navy)}
button.card{cursor:pointer;width:100%}
.card .more{display:none;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line);color:#e1e8fb;font-size:1rem}
.card .hint{font-size:.88rem;color:var(--gold);font-weight:700}
.card.open .more{display:block}
.card.open .hint{display:none}
.rows{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(6px);overflow:hidden}
.row{display:flex;align-items:center;gap:clamp(14px,3vw,36px);padding:16px clamp(16px,3vw,32px);border-bottom:1px solid rgba(42,75,160,.7);transition:background .2s}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(42,75,160,.35)}
.rk{flex:none;min-width:5.2ch;font-family:var(--head);font-weight:700;font-size:clamp(1.3rem,2.8vw,1.9rem);color:var(--gold);font-variant-numeric:tabular-nums}
.rv{min-width:0;font-size:clamp(1.05rem,2.1vw,1.35rem);line-height:1.6}
.split{display:grid;gap:32px;grid-template-columns:3fr 2fr;align-items:start}
.stats{display:flex;flex-direction:column;gap:14px}
.stat{display:flex;align-items:baseline;gap:20px;background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:14px 26px}
.stat .num{font-family:var(--head);font-weight:700;font-size:2.3rem;color:var(--gold);font-variant-numeric:tabular-nums;min-width:4.2ch}
.motto{display:flex;flex-direction:column;gap:16px}
.mrow{display:flex;align-items:center;gap:clamp(14px,3vw,32px);background:var(--navy);border:1px solid var(--line);border-radius:20px;padding:18px clamp(18px,3vw,36px);transition:transform .25s,background .25s,color .25s}
.mrow:hover{transform:translateX(8px);background:var(--gold);color:var(--navy)}
.mrow:hover .ms{color:var(--navy)}
.mw{font-family:var(--head);font-weight:700;font-size:clamp(1.7rem,4.6vw,3.2rem);line-height:1.3;min-width:0}
.ms{margin-left:auto;max-width:24ch;color:var(--mute);font-size:1.05rem;text-align:right}
.duo{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:stretch}
.arrow{display:flex;align-items:center;color:var(--gold)}
.arrow svg{width:64px;height:40px}
.date{font-family:var(--head);font-weight:700;font-size:clamp(1.6rem,3.8vw,2.7rem);line-height:1.3}
.bigyear{font-family:var(--head);font-weight:700;font-size:clamp(3.6rem,13vw,8rem);line-height:1.1;color:var(--gold)}
.mahad{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,5vw,64px);align-items:center}
.quote{border-left:6px solid var(--gold);padding:4px 0 4px 24px;font-size:clamp(1.05rem,2.1vw,1.35rem);line-height:1.7;margin:0 0 16px}
.with-book{display:grid;grid-template-columns:1fr 260px;gap:32px;align-items:center}
.with-book svg{width:100%;height:auto;color:var(--gold)}
.jay{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.jay .w{margin:0;font-family:var(--head);font-weight:700;font-size:clamp(2.6rem,9vw,6rem);line-height:1.2}
.jay .w:nth-of-type(3){color:var(--gold)}
.jaybox{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-top:10px}
.float{position:fixed;z-index:80;pointer-events:none;font-family:var(--head);font-weight:700;color:var(--gold);font-size:1.5rem;animation:rise 1.4s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-120px)}}

/* ---------- footer ---------- */
footer{background:#050f33;border-top:1px solid var(--line);padding:clamp(40px,6vw,64px) clamp(16px,5vw,64px) 28px}
.foot{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.foot-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:28px}
.foot h3{margin:0 0 6px;font-family:var(--head);font-size:1.35rem}
.foot p{margin:0}
.social{display:flex;flex-wrap:wrap;gap:12px}
.social a{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:8px 20px;border-radius:999px;border:1px solid var(--line);background:rgba(17,43,120,.55);text-decoration:none;font-weight:700;transition:background .2s,transform .2s}
.social a:hover{background:var(--gold);color:var(--navy);transform:translateY(-3px)}
.social svg{width:22px;height:22px;flex:none}
.copy{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:var(--mute);font-size:.95rem}

/* ---------- menu drawer ---------- */
.menu{position:fixed;inset:0;z-index:70;background:rgba(3,10,36,.72);display:flex;justify-content:flex-end}
.menu[hidden]{display:none}
.panel{width:min(560px,100%);height:100%;background:var(--navy);border-left:1px solid var(--line);padding:18px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;animation:slidein .3s ease-out}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel h3{margin:0;font-family:var(--head);font-size:1.3rem}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(17,43,120,.55);text-decoration:none;font-weight:600;line-height:1.4;transition:background .2s,border-color .2s}
.mi:hover{background:var(--line)}
.mi .n{flex:none;font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold);min-width:2ch}
.mi.cur{border-color:var(--gold);background:rgba(242,185,15,.14)}

.totop{position:fixed;right:18px;bottom:18px;z-index:55;width:48px;height:48px;border-radius:50%;border:0;background:var(--gold);color:var(--navy);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .2s}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{transform:translateY(-3px)}
.totop svg{width:22px;height:22px}

@media (max-width:760px){
  body{font-size:17px}
  .hero::before{width:100%;opacity:.3;-webkit-mask-image:none;mask-image:none}
  .hero::after{background:rgba(7,22,66,.45)}
  .split,.with-book,.mahad,.duo{grid-template-columns:1fr}
  .arrow{justify-content:center;transform:rotate(90deg)}
  .mlist{grid-template-columns:1fr}
  .ms{display:none}
  .with-book svg{max-width:200px}
  .brand span{max-width:34vw}
  .btn.gold .lbl{display:none}
  .btn.gold{padding:8px 16px}
  .lang button{padding:6px 10px}
}
@media (max-width:420px){.brand span{display:none}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>

function applyStatic(){
  document.documentElement.lang=lang;
  document.title=lang==='hi'?'बाबासाहेब भीमराव अम्बेडकर':'Babasaheb Bhimrao Ambedkar';
  document.querySelectorAll('[data-en]').forEach(function(el){el.textContent=el.dataset[lang];});
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===lang?'true':'false');});
  $('#toTop').setAttribute('aria-label',lang==='hi'?'ऊपर जाएँ':'Back to top');
}
function buildMenu(){
  var all=[{id:'home',n:B('Home','होम')}].concat(SECTIONS,[ABOUT]);
  $('#mlist').innerHTML=all.map(function(s,i){
    return '<a class="mi" href="#'+s.id+'" data-id="'+s.id+'"><span class="n">'+(i+1)+'</span><span>'+t(s.n)+'</span></a>';
  }).join('');
}
function updateJay(){var el=$('#jayCount');if(el)el.textContent=(lang==='hi'?'अब तक '+jc+' बार':'So far: '+jc+' times');}

/* reveal on scroll + counters */
function observe(){
  if(io)io.disconnect();
  var els=main.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in');});counters();return;}
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);if(e.target.querySelector&&e.target.querySelector('.count'))counters(e.target);}});
  },{threshold:.12,rootMargin:'0px 0px -40px 0px'});
  els.forEach(function(e){io.observe(e);});
}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function counters(scope){
  (scope||document).querySelectorAll('.count').forEach(function(el){
    if(el.dataset.done)return;el.dataset.done='1';
    var to=+el.dataset.to;if(reduce){el.textContent=to;return;}
    var from=to-120,t0=null;
    function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/1100);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);}
    el.textContent=from;requestAnimationFrame(step);
  });
}

function setYear(v){
  year=+v;var e=currentEvent();
  var a=$('#tlYear'),b=$('#tlEv'),r=$('#tlRange');
  if(a)a.textContent=e[0];if(b)b.textContent=t(e[1]);if(r&&+r.value!==year)r.value=year;
}
function jayFloat(btn){
  jc++;updateJay();
  if(reduce)return;
  var r=btn.getBoundingClientRect(),f=document.createElement('span');
  f.className='float';f.textContent=t([B('Jai Bhim','जय भीम'),B('Jai Bharat','जय भारत'),B('Jai Samvidhan','जय संविधान')][jc%3]);
  f.style.left=(r.left+Math.random()*r.width*.8)+'px';f.style.top=(r.top-6)+'px';
  document.body.appendChild(f);setTimeout(function(){f.remove();},1500);
}
main.addEventListener('input',function(e){if(e.target.id==='tlRange')setYear(e.target.value);});
main.addEventListener('click',function(e){
  var j=e.target.closest('[data-year]');if(j){setYear(j.dataset.year);return;}
  var c=e.target.closest('button.tap');if(c){var o=c.classList.toggle('open');c.setAttribute('aria-expanded',o);return;}
  var b=e.target.closest('#jayBtn,#heroJay');if(b)jayFloat(b);
});

var menu=$('#menu'),menuBtn=$('#menuBtn');
function openMenu(){menu.hidden=false;menuBtn.setAttribute('aria-expanded','true');var c=$('#mlist .cur')||$('#mlist .mi');if(c)c.focus();}
function closeMenu(){if(menu.hidden)return;menu.hidden=true;menuBtn.setAttribute('aria-expanded','false');menuBtn.focus();}
menuBtn.addEventListener('click',function(){menu.hidden?openMenu():closeMenu();});
$('#menuClose').addEventListener('click',closeMenu);
menu.addEventListener('click',function(e){
  if(e.target===menu){closeMenu();return;}
  if(e.target.closest('.mi')){menu.hidden=true;menuBtn.setAttribute('aria-expanded','false');}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu();});

/* scroll: progress bar, active menu item, back-to-top, hero parallax */
var ticking=false;
function onScroll(){
  var h=document.documentElement,max=h.scrollHeight-h.clientHeight;
  $('#progress').style.width=(max>0?(window.scrollY/max*100):0)+'%';
  $('#toTop').classList.toggle('show',window.scrollY>600);
  var ids=['home'].concat(SECTIONS.map(function(s){return s.id;}),['about']),cur='home',line=window.scrollY+120;
  ids.forEach(function(id){var el=document.getElementById(id);if(el&&el.offsetTop<=line)cur=id;});
  document.querySelectorAll('#mlist .mi').forEach(function(a){a.classList.toggle('cur',a.dataset.id===cur);});
  var cb=$('#chakraBig');if(cb&&!reduce)cb.style.transform='translateY(-50%) rotate('+(window.scrollY*0.15)+'deg)';
  ticking=false;
}
window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(onScroll);}},{passive:true});
$('#toTop').addEventListener('click',function(){window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});});

/* start */
render();
})();
</script>
</body>
</html>
